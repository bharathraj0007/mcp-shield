version: "1.0"
mode: "enforce" # "monitor" | "enforce" | "baseline" | "quarantine" | "audit-only"
inherit: []
denyPaths:
  - "**/.env"
  - "**/.env.*"
  - "~/.ssh/**"
  - "~/.aws/**"
  - "~/.gnupg/**"
  - "/etc/passwd"
allowPaths:
  - "./src/**"
blockedCommands:
  - "rm -rf"
  - "curl * | sh"
  - "wget * | bash"
  - "chmod 777"
disabledRules: []
allowedServers: [] # Optional allowlist for MS-007 Shadow MCP detection
failOnSeverity: "high" # "critical" | "high" | "medium" | "low"
secretDetection:
  sensitivity: "balanced" # "low" | "balanced" | "strict"
  exclude: []
blockedMethods: []
allowedTools: []
deniedTools: []
allowedHosts: []
deniedHosts: []
rugPull:
  mode: "enforce" # "off" | "monitor" | "approve" | "enforce"
  persistence: "local"
  immutableFields:
    - "description"
    - "inputSchema"
