name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: cli/package.json

      - name: Install dependencies
        working-directory: cli
        run: npm install

      - name: Type check and build
        working-directory: cli
        run: npm run build

      - name: Run unit and integration tests
        working-directory: cli
        run: npm test

      - name: Run latency and corpus benchmarks
        working-directory: cli
        run: npm run bench

      - name: Run black-box self-test
        working-directory: cli
        run: npm run self-test

      - name: Generate SARIF Security Report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        working-directory: cli
        run: node dist/index.js scan . --format sarif > ../mcp-shield.sarif

      - name: Upload SARIF report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 20
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: mcp-shield.sarif
