name: Bug Report
description: Report a bug, crash, or unexpected behavior in mcp-shield
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure no sensitive credentials or API keys are included in your issue.
  - type: input
    id: version
    attributes:
      label: mcp-shield Version
      description: Run `mcp-shield --version`
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version`
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL/Arch)
        - Windows 10/11
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or command lines to reproduce the issue.
      placeholder: |
        1. Run 'mcp-shield scan ...'
        2. Observe error output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead.
    validations:
      required: true
