name: Bug Report
description: Report a reproducible defect, bypass, or unexpected behavior in mcp-shield
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure sensitive credentials and API keys are redacted before submitting.
        If this is a critical security vulnerability, please report privately via [Security Advisories](https://github.com/bharathraj0007/mcp-shield/security/advisories/new).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Concise description of the defect or unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, MCP configuration snippet, or JSON-RPC payload to reproduce the issue.
      placeholder: |
        1. Run 'mcp-shield scan ./mcp.json'
        2. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment Details
      description: Operating System, Node.js version, and mcp-shield version.
      placeholder: Windows 11 / macOS 14 / Ubuntu 22.04, Node.js v20.11.0, mcp-shield v1.0.0
    validations:
      required: true
